name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - runs-on: ubuntu-latest
            arch: x86_64
            target: x86_64-unknown-linux-gnu
          - runs-on: ubuntu-24.04-arm
            arch: aarch64
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v4

      - name: Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          target: ${{ matrix.target }}

      - name: Build Server
        run: cargo build --release --target ${{ matrix.target }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build GUI
        run: |
          cd gui
          npm ci
          npm run build

      - name: Package
        run: |
          mkdir -p package/gui-dist
          cp target/${{ matrix.target }}/release/b3nbox-server package/
          cp -r gui/dist/* package/gui-dist/
          tar -czf b3nbox-Linux-${{ matrix.arch }}.tar.gz -C package b3nbox-server gui-dist

      - name: Upload Release Artifact
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: b3nbox-Linux-${{ matrix.arch }}.tar.gz
          generate_release_notes: true

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Tests
        uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace

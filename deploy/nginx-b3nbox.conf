# B3nBox Studio - nginx als statischer GUI-Server + Reverse-Proxy
# Installation:
#   sudo cp deploy/nginx-b3nbox.conf /etc/nginx/sites-available/b3nbox
#   sudo ln -sf /etc/nginx/sites-available/b3nbox /etc/nginx/sites-enabled/b3nbox
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Die GUI muss gebaut sein:  cd gui && npm install && npm run build
# Der B3nBox-Server laeuft auf 127.0.0.1:8300 (nginx uebernimmt Port 80).

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Statische Web-GUI (Kopie von gui/dist, damit www-data lesend zugreifen kann)
    root /var/www/b3nbox;
    index index.html;

    # SPA-Fallback: unbekannte Pfeile auf index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets lang cachen (vite haengt Hash an den Dateinamen)
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # API zum B3nBox-Server durchreichen
    location /v1/ {
        proxy_pass http://127.0.0.1:8300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE-Streaming (Chat)
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location /health {
        proxy_pass http://127.0.0.1:8300;
        proxy_set_header Host $host;
    }
}

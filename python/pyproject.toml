[project]
name = "b3nbox"
version = "0.1.0"
description = "B3nBox Studio Agent SDK - LLM Manager Client, Express-Tasks, REA/ECC Pipeline"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="B3nB0x Studio - Agent mit eingebautem LLM Manager: Rust-Kern, Multi-LLM-Routing, REA/ECC-Pipeline, MCP-Tools, Injection-Guard" />
    <title>B3nBox Studio</title>
    <style>
      body { background: #0b1220; color: #e2e8f0; }
      ::-webkit-scrollbar { width: 10px; height: 10px; }
      ::-webkit-scrollbar-track { background: #0b1220; }
      ::-webkit-scrollbar-thumb { background: #334155; border-radius: 5px; }
      ::-webkit-scrollbar-thumb:hover { background: #8b5cf6; }
      input, select, textarea { background: #1e293b; color: #e2e8f0; border: 1px solid #334155; border-radius: 4px; padding: 4px 8px; }
      button { background: #1e293b; color: #e2e8f0; border: 1px solid #8b5cf6; border-radius: 6px; padding: 0.4rem 0.8rem; cursor: pointer; }
      button:hover { background: #8b5cf6; color: #fff; }
      table { border: 1px solid #334155; }
      th, td { border-bottom: 1px solid #1e293b; }
      a { color: #a78bfa; }
      details { background: #0f172a; border: 1px solid #334155; border-radius: 6px; padding: 8px; }

      /* --- Layout: Sidebar links, Inhalt Mitte, Kurzhilfe rechts --- */
      .app-shell { display: flex; min-height: 100vh; }
      .sidebar {
        width: 230px; flex-shrink: 0; position: sticky; top: 0;
        height: 100vh; overflow-y: auto;
        padding: 1.25rem 0.75rem; box-sizing: border-box;
        background: linear-gradient(180deg, #0f172a 0%, #0b1220 100%);
        border-right: 1px solid #1e293b;
      }
      .brand { font-size: 1.15rem; font-weight: 700; padding: 0 0.5rem 1rem; letter-spacing: 0.02em; }
      .brand-glow { color: #a78bfa; text-shadow: 0 0 12px rgba(139, 92, 246, 0.55); }
      .brand-sub { font-size: 0.72rem; font-weight: 400; color: #64748b; letter-spacing: 0.14em; text-transform: uppercase; padding-top: 2px; }
      .sidebar-nav { display: flex; flex-direction: column; gap: 2px; }
      .nav-item {
        text-align: left; padding: 0.45rem 0.75rem; border: none; border-radius: 6px;
        background: transparent; color: #94a3b8; font-size: 0.88rem; cursor: pointer;
        transition: background 0.15s, color 0.15s;
      }
      .nav-item:hover { background: #1e293b; color: #e2e8f0; }
      .nav-item.active { background: rgba(139, 92, 246, 0.18); color: #c4b5fd; font-weight: 600; box-shadow: inset 2px 0 0 #8b5cf6; }
      .content { flex: 1; padding: 1.5rem 2rem; min-width: 0; }
      .hint-panel {
        width: 230px; flex-shrink: 0; position: sticky; top: 0; height: 100vh;
        box-sizing: border-box; padding: 1.25rem 1rem;
        background: #0f172a; border-left: 1px solid #1e293b;
        font-size: 0.85rem; color: #94a3b8; overflow-y: auto;
      }
      .hint-panel h3 { margin: 0 0 0.5rem; color: #c4b5fd; font-size: 0.95rem; }
      .hint-panel p { margin: 0 0 0.75rem; line-height: 1.5; }
      .hint-foot { color: #64748b; font-size: 0.78rem; }
      @media (max-width: 1100px) { .hint-panel { display: none; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
